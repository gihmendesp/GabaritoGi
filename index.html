<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabarito Online da Gi</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>📘 Gabarito Online da Gi</h1>
<p>Marque suas respostas e veja seu desempenho</p>
</header>

<main>

<section class="config">

<h2>Configurar Simulado</h2>

<input type="number" id="inicio" placeholder="Questão inicial (ex: 20)">
<input type="number" id="fim" placeholder="Questão final (ex: 69)">

<button onclick="gerar()">Gerar Gabarito</button>

</section>

<section id="prova"></section>

<section class="resultado">

<button onclick="corrigir()">✔ Corrigir Prova</button>

<div id="resumo"></div>

</section>

</main>

<footer>
<p>Gabarito Online da Gi © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
